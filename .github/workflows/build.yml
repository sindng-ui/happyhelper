name: Build and Package HappyHelper

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Build Script (WPF + WebView2 + C# Native)
      shell: powershell
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        .\build.ps1

    - name: Compress Dist Folder to Zip
      shell: powershell
      run: |
        Compress-Archive -Path .\dist-csharp\* -DestinationPath .\happyhelper-win-x64.zip -Force

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: happyhelper-win-x64
        path: .\happyhelper-win-x64.zip
        retention-days: 90

    - name: Create Release and Upload Asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: .\happyhelper-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
